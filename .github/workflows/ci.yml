name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          fail=0

          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html no fue generado"
            fail=1
          fi

          for asset in og-image.png robots.txt profile.webp project-ecommerce.webp; do
            if [ ! -f "dist/$asset" ]; then
              echo "::error::falta dist/$asset en el build"
              fail=1
            fi
          done

          if ! grep -q 'property="og:image" content="https://www.facucode.dev/og-image.png"' dist/index.html; then
            echo "::error::og:image no es una URL absoluta (rompe la preview en redes)"
            fail=1
          fi

          if grep -qE 'og:image" content="/' dist/index.html; then
            echo "::error::og:image relativo detectado"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Artefactos OK: $(du -sh dist | cut -f1)"
