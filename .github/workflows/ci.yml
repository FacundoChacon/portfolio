name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + verificaciones + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, verificaciones, tests, build y verificación del build
        run: npm run ci

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          fail=0

          for page in index.html configurador/index.html; do
            if [ ! -f "dist/$page" ]; then
              echo "::error::dist/$page no fue generado"
              fail=1
            fi
          done

          for asset in og-image.png robots.txt sitemap.xml profile.webp project-ecommerce.webp; do
            if [ ! -f "dist/$asset" ]; then
              echo "::error::falta dist/$asset en el build"
              fail=1
            fi
          done

          if ! compgen -G 'dist/assets/Configurador-*.js' > /dev/null; then
            echo "::error::falta el chunk dist/assets/Configurador-*.js (el configurador entró al bundle inicial)"
            fail=1
          fi

          if grep -q 'Configurador-' dist/index.html; then
            echo "::error::dist/index.html referencia el chunk del configurador (la home lo descargaría)"
            fail=1
          fi

          if ! grep -q 'property="og:image" content="https://www.facucode.dev/og-image.png"' dist/index.html; then
            echo "::error::og:image no es una URL absoluta (rompe la preview en redes)"
            fail=1
          fi

          if grep -qE 'og:image" content="/' dist/index.html dist/configurador/index.html; then
            echo "::error::og:image relativo detectado"
            fail=1
          fi

          if ! grep -q 'rel="canonical" href="https://www.facucode.dev/configurador"' dist/configurador/index.html; then
            echo "::error::dist/configurador/index.html no declara su propio canonical"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "Artefactos OK: $(du -sh dist | cut -f1)"
